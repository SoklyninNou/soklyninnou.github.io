<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/pictures/reze.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Soklynin Nou</title>
    <script>
      // Restores the real path GitHub Pages' 404.html redirect encoded into
      // ?redirect=..., before React Router reads the URL on mount.
      (function () {
        var redirect = new URLSearchParams(window.location.search).get('redirect');
        if (redirect) window.history.replaceState(null, '', redirect);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
